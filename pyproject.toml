[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-mcp"
version = "0.1.0"
description = "Let a lead AI (Claude Code) delegate coding to cheaper, role-scoped sub-agents over MCP, with enforced file ownership."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["mcp", "claude-code", "multi-agent", "deepseek", "orchestration", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
ensemble-mcp = "ensemble_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
